<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock In</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header id="header" style="display:none;">
    <div class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        LOCK IN
    </div>
    <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
        </button>
    </div>
</header>

<!-- ── Views ────────────────────────────────────────────────────────────────── -->

<!-- Loading -->
<div id="view-loading" class="view centered">
    <div class="spinner"></div>
</div>

<!-- Settings (backend URL) -->
<div id="view-settings" class="view" style="display:none;">
    <div class="section-title">BACKEND URL</div>
    <p class="hint">Enter the URL of your Lock In server.</p>
    <input type="url" id="appUrlInput" placeholder="http://localhost" autocomplete="off">
    <p id="urlError" class="error" style="display:none;"></p>
    <button id="saveUrlBtn" class="btn-primary">SAVE &amp; CONNECT</button>
    <button id="cancelSettingsBtn" class="btn-ghost">CANCEL</button>
</div>

<!-- Login -->
<div id="view-login" class="view" style="display:none;">
    <div class="section-title">SIGN IN</div>
    <input type="email"    id="loginEmail"    placeholder="Email"    autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <p id="loginError" class="error" style="display:none;"></p>
    <button id="loginBtn" class="btn-primary">SIGN IN</button>
    <button id="loginSettingsBtn" class="btn-ghost" style="margin-top:4px;font-size:11px;opacity:0.6;">Change server URL</button>
</div>

<!-- Save credential prompt -->
<div id="view-save" class="view" style="display:none;">
    <div class="section-title">SAVE PASSWORD?</div>
    <p class="hint" id="saveHint">Lock In detected a login on <strong id="saveDomain"></strong>.</p>
    <input type="text"     id="saveNickname" placeholder="Service name" autocomplete="off">
    <input type="text"     id="saveEmail"    placeholder="Email / Username" autocomplete="off">
    <input type="password" id="savePassword" placeholder="Password" autocomplete="new-password">
    <p id="saveError" class="error" style="display:none;"></p>
    <div class="btn-row">
        <button id="dismissSaveBtn" class="btn-ghost">DISMISS</button>
        <button id="confirmSaveBtn" class="btn-primary">SAVE</button>
    </div>
</div>

<!-- Unlocked vault -->
<div id="view-vault" class="view" style="display:none;">
    <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Search passwords…" autocomplete="off">
    </div>

    <div id="domainSection" style="display:none;">
        <div class="section-label" id="domainLabel"></div>
        <div id="domainEntries" class="entries-list"></div>
    </div>

    <div id="allSection">
        <div class="section-label" id="allLabel">ALL PASSWORDS</div>
        <div id="allEntries" class="entries-list">
            <div class="empty-msg">No passwords saved yet.</div>
        </div>
    </div>
</div>

<!-- ── Entry card template (cloned by JS) ──────────────────────────────────── -->
<template id="entryTemplate">
    <div class="entry-card">
        <div class="entry-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>
        <div class="entry-info">
            <div class="entry-name">—</div>
            <div class="entry-user">—</div>
        </div>
        <div class="entry-actions">
            <button class="entry-fill-btn" title="Autofill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9.5,6.5v3h-3v-3H9.5 M11,5H5v6h6V5L11,5z M9.5,14.5v3h-3v-3H9.5 M11,13H5v6h6V13L11,13z M17.5,6.5v3h-3v-3H17.5 M19,5h-6v6h6V5L19,5z M13,13h1.5v1.5H13V13z M14.5,14.5H16V16h-1.5V14.5z M16,13h1.5v1.5H16V13z M13,16h1.5v1.5H13V16z M16,16h1.5v1.5H16V16z M14.5,17.5H16V19h-1.5V17.5z M16,14.5h1.5V16H16V14.5z M17.5,16H19v1.5h-1.5V16z"/>
                </svg>
            </button>
            <button class="entry-copy-btn" title="Copy password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
            </button>
        </div>
    </div>
</template>

<script type="module" src="popup.js"></script>
</body>
</html>
